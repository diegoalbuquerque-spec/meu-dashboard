name: Atualizar painel

on:
  schedule:
    # 11:00 UTC = 08:00 no horario de Brasilia
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ler a planilha e atualizar o index.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/atualizar_painel.py

      - name: Publicar as mudancas
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualizacao automatica do painel ($(date -u '+%d/%m/%Y %H:%M UTC'))"
          git push
